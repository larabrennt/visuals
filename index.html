<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LARABRENNT portfolio">
  <title>LARABRENNT</title>

  <style>
    :root {
      --pad: clamp(16px, 2vw, 30px);
      --ink: #111;
      --paper: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
    }

    body {
      overflow: hidden;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    .gallery {
      position: relative;
      width: 100vw;
      height: 100svh;
      user-select: none;
      -webkit-user-select: none;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      background: var(--paper);
    }

    .slide.is-active {
      display: block;
    }

    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .contact-slide {
      align-items: center;
      justify-content: center;
      padding: var(--pad);
      cursor: default;
    }

    .contact-slide.is-active {
      display: flex;
    }

    .contact-details {
      max-width: 440px;
      padding: 24px;
      text-align: center;
      font-size: clamp(8px, 0.825vw, 12px);
      line-height: 1.3;
      letter-spacing: -0.025em;
    }

    .contact-details p {
      margin: 0 0 8px;
    }

    .contact-details p:last-child {
      margin-bottom: 0;
    }

    .contact-details a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 1px;
    }

    .hint {
      position: fixed;
      z-index: 11;
      bottom: 18px;
      left: var(--pad);
      color: #fff;
      mix-blend-mode: difference;
      font-size: 11px;
      pointer-events: none;
      transition: opacity 200ms ease;
    }

    @media (max-width: 600px) {
      .hint {
        bottom: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="gallery" aria-label="Portfolio image carousel" tabindex="0">

    <figure class="slide is-active">
      <img src="portfolio_Page_1.jpg" alt="Portfolio work 1">
    </figure>

    <figure class="slide">
      <img src="portfolio_Page_2.jpg" alt="Portfolio work 2">
    </figure>

    <figure class="slide">
      <img src="portfolio_Page_3.jpg" alt="Portfolio work 3">
    </figure>

    <figure class="slide">
      <img src="portfolio_Page_4.jpg" alt="Portfolio work 4">
    </figure>

    <figure class="slide">
      <img src="portfolio_Page_5.jpg" alt="Portfolio work 5">
    </figure>

    <figure class="slide">
      <img src="portfolio_Page_6.jpg" alt="Portfolio work 6">
    </figure>

    <figure class="slide">
      <img src="portfolio_Page_7.jpg" alt="Portfolio work 7">
    </figure>

    <!-- Letzte, leere Folie: Kontaktdaten hier ersetzen -->
    <section class="slide contact-slide" aria-label="Contact">
      <div class="contact-details">
        <p>LARABRENNT VISUALS</p>
        <p>
          <a href="mailto:lara.brenner@posteo.com">
            lara.brenner@posteo.com
          </a>
        </p>
      </div>
    </section>

  </main>

  <span class="hint" aria-hidden="true">click to browse</span>

  <script>
    const slides = [...document.querySelectorAll(".slide")];
    const gallery = document.querySelector(".gallery");
    const hint = document.querySelector(".hint");

    let index = 0;

    function show(next) {
      slides[index].classList.remove("is-active");
      index = (next + slides.length) % slides.length;
      slides[index].classList.add("is-active");
      hint.style.opacity = "0";
    }

    gallery.addEventListener("click", (event) => {
      if (event.target.closest("a")) return;

      if (event.clientX < window.innerWidth / 2) {
        show(index - 1);
      } else {
        show(index + 1);
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === " ") {
        event.preventDefault();
        show(index + 1);
      }

      if (event.key === "ArrowLeft") {
        show(index - 1);
      }
    });
  </script>
</body>
</html>
