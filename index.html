<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronological History Timeline</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  :root {
    --line: #202020;
    --paper: #ffffff;
    --muted: #626262;
    --green: #198754;
    --blue: #1769aa;
    --red: #c62828;
    --magenta: #a21caf;
    --orange: #d96b00;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--paper);
    font-family: Arial, Helvetica, sans-serif;
  }

  .timeline-shell {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 24px 0 14px;
    scrollbar-color: #888 transparent;
    scrollbar-width: thin;
  }

  .timeline {
    position: relative;
    min-width: 2200px;
    padding: 35px 42px 42px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 18px;
    margin: 0 0 28px;
    font-size: 10pt;
    font-weight: normal;
    color: #202020;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .legend-dot {
    width: 10pt;
    height: 10pt;
    border-radius: 50%;
    flex: 0 0 10pt;
  }

  .axis-wrap {
    position: relative;
    height: 570px;
  }

  .axis {
    position: absolute;
    top: 250px;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--line);
  }

  .tick {
    position: absolute;
    top: 242px;
    width: 1px;
    height: 17px;
    background: var(--line);
  }

  .tick-label {
    position: absolute;
    top: 267px;
    transform: translateX(-50%);
    font-size: 9pt;
    color: var(--muted);
    white-space: nowrap;
  }

  .event {
    position: absolute;
    width: 190px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10pt;
    font-weight: normal;
    line-height: 1.28;
    text-align: left;
  }

  .event-marker {
    position: absolute;
    top: -5pt;
    left: 0;
    width: 10pt;
    height: 10pt;
    border-radius: 50%;
    background: currentColor;
    transform: translateX(-50%);
  }

  .event-stem {
    position: absolute;
    top: 0;
    left: 0;
    width: 1px;
    background: currentColor;
    opacity: 0.7;
  }

  .event-content {
    position: absolute;
    left: 0;
    width: 190px;
  }

  .event-date {
    margin-bottom: 4px;
    font-size: 9pt;
    color: #333;
  }

  .empty, .error {
    padding: 24px 42px;
    font: 10pt Arial, sans-serif;
  }
</style>
</head>

<body>
<div class="timeline-shell">
  <div id="timeline" class="timeline">
    <div class="empty">Loading timeline…</div>
  </div>
</div>

<script>
const EXCEL_FILE =
  "Chronological-History-of-Franzosisch-Buchholz-the-Panke-and-Blankenburg.xlsx";

const themes = [
  { column: "Date.1", color: "#198754", label: "Französisch Buchholz" },
  { column: "Panke River", color: "#1769aa", label: "Panke River" },
  { column: "Blankenburg", color: "#c62828", label: "Blankenburg" },
  { column: "Kleingartenanlagen Development", color: "#a21caf", label: "Kleingartenanlagen Development" },
  { column: "Railway", color: "#d96b00", label: "Railway" }
];

function clean(value) {
  if (value === undefined || value === null) return "";
  return String(value).replace(/\s+/g, " ").trim();
}

function parseYear(dateText) {
  const text = clean(dateText);
  if (!text) return null;

  const lower = text.toLowerCase();
  const matches = [...text.matchAll(/(\d{1,5})\s*(bc|bce|ad|ce)?/gi)];

  if (!matches.length) {
    const century = lower.match(/(\d{1,2})(st|nd|rd|th)\s+century/);
    if (century) return (Number(century[1]) - 1) * 100 + 50;
    return null;
  }

  const values = matches.map(match => {
    const number = Number(match[1]);
    const era = (match[2] || "").toLowerCase();
    return era === "bc" || era === "bce" ? -number : number;
  });

  if (lower.includes("before") && /bc|bce/.test(lower)) return -values[0];
  if (lower.includes("until") && values.length) return values[0];
  return Math.min(...values);
}

function createLegend() {
  const legend = document.createElement("div");
  legend.className = "legend";

  themes.forEach(theme => {
    const item = document.createElement("div");
    item.className = "legend-item";

    const dot = document.createElement("span");
    dot.className = "legend-dot";
    dot.style.background = theme.color;

    const label = document.createElement("span");
    label.textContent = theme.label;

    item.append(dot, label);
    legend.append(item);
  });

  return legend;
}

function renderTimeline(rows) {
  const root = document.getElementById("timeline");
  root.innerHTML = "";
  root.append(createLegend());

  const events = [];

  rows.forEach((row, rowIndex) => {
    const date = clean(row["Date"]);
    const year = parseYear(date);

    themes.forEach(theme => {
      const text = clean(row[theme.column]);
      if (text && year !== null) {
        events.push({
          date,
          year,
          text,
          color: theme.color,
          theme: theme.label,
          rowIndex
        });
      }
    });
  });

  if (!events.length) {
    root.insertAdjacentHTML(
      "beforeend",
      '<div class="error">No dated events were found in the selected worksheet.</div>'
    );
    return;
  }

  const years = events.map(event => event.year);
  const minYear = Math.min(...years);
  const maxYear = Math.max(...years);
  const range = Math.max(maxYear - minYear, 1);

  const width = Math.max(2200, Math.ceil(range * 0.52 + 520));
  root.style.minWidth = width + "px";

  const axisWrap = document.createElement("div");
  axisWrap.className = "axis-wrap";

  const axis = document.createElement("div");
  axis.className = "axis";
  axisWrap.append(axis);

  const leftPad = 10;
  const usableWidth = width - 84;

  const grouped = new Map();
  events.forEach(event => {
    const key = String(event.year);
    if (!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(event);
  });

  const placedByPosition = new Map();

  [...grouped.values()]
    .sort((a, b) => a[0].year - b[0].year)
    .forEach(group => {
      const year = group[0].year;
      const x = leftPad + ((year - minYear) / range) * usableWidth;
      const stack = placedByPosition.get(year) || 0;

      const tick = document.createElement("div");
      tick.className = "tick";
      tick.style.left = x + "px";
      axisWrap.append(tick);

      const tickLabel = document.createElement("div");
      tickLabel.className = "tick-label";
      tickLabel.style.left = x + "px";
      tickLabel.textContent = group[0].date;
      axisWrap.append(tickLabel);

      group.forEach((event, index) => {
        const level = stack + index;
        const eventBox = document.createElement("article");
        eventBox.className = "event";
        eventBox.style.left = x + "px";
        eventBox.style.top = (260 + 10 + level * 104) + "px";
        eventBox.style.color = event.color;

        const marker = document.createElement("span");
        marker.className = "event-marker";

        const stem = document.createElement("span");
        stem.className = "event-stem";
        stem.style.height = (10 + level * 104) + "px";

        const content = document.createElement("div");
        content.className = "event-content";
        content.innerHTML =
          '<div class="event-date">' + event.theme + '</div>' +
          '<div>' + event.text + '</div>';

        eventBox.append(marker, stem, content);
        axisWrap.append(eventBox);
      });

      placedByPosition.set(year, stack + group.length);
    });

  root.append(axisWrap);
}

fetch(EXCEL_FILE)
  .then(response => {
    if (!response.ok) throw new Error("Excel file could not be loaded.");
    return response.arrayBuffer();
  })
  .then(buffer => {
    const workbook = XLSX.read(buffer, { type: "array" });
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
    renderTimeline(rows);
  })
  .catch(error => {
    document.getElementById("timeline").innerHTML =
      '<div class="error">Timeline could not be loaded: ' +
      error.message +
      "</div>";
  });
</script>
</body>
</html>
