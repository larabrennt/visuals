<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LARABRENNT portfolio">
  <title>LARABRENNT</title>
  <style>
    :root {
      --pad: clamp(16px, 2vw, 30px);
      --header-height: 58px;
      --ink: #111;
      --paper: #ffff;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; background: var(--paper); }

    body {
      overflow: hidden;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    .site-header {
      position: fixed;
      z-index: 10;
      inset: 0 0 auto;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--pad);
      pointer-events: none;
      mix-blend-mode: difference;
      color: white;
    }

    .wordmark, .contact {
      pointer-events: auto;
      font-size: 12px;
      line-height: 1;
      letter-spacing: -0.035em;
      font-weight: 400;
      text-decoration: none;
      color: inherit;
    }

    .wordmark { font-size: clamp(13px, 1.25vw, 18px); }

    .contact {
      border-bottom: 1px solid currentColor;
      padding-bottom: 2px;
      transition: opacity 160ms ease;
    }

    .contact:hover { opacity: .55; }

    .gallery {
      width: 100vw;
      height: 100svh;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 550ms ease;
      pointer-events: none;
      background: var(--paper);
    }

    .slide.is-active { opacity: 1; pointer-events: auto; }

    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .counter {
      position: fixed;
      z-index: 11;
      right: var(--pad);
      bottom: 18px;
      color: white;
      mix-blend-mode: difference;
      font-size: 11px;
      letter-spacing: -0.02em;
      pointer-events: none;
    }

    .hint {
      position: fixed;
      z-index: 11;
      left: var(--pad);
      bottom: 18px;
      color: white;
      mix-blend-mode: difference;
      font-size: 11px;
      pointer-events: none;
      transition: opacity 300ms ease;
    }

    @media (max-width: 600px) {
      :root { --header-height: 52px; }
      .counter, .hint { bottom: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#top" aria-label="LARABRENNT home">LARABRENNT</a>
    <!-- Replace the email address below with your own. -->
    <a class="contact" href="mailto:hello@larabrennt.com">contact</a>
  </header>

  <main class="gallery" id="top" aria-label="Portfolio image carousel" tabindex="0">
    <figure class="slide is-active"><img src="portfolio_Page_1.jpg" alt="Portfolio work 1"></figure>
    <figure class="slide"><img src="portfolio_Page_2.jpg" alt="Portfolio work 2"></figure>
    <figure class="slide"><img src="portfolio_Page_3.jpg" alt="Portfolio work 3"></figure>
    <figure class="slide"><img src="portfolio_Page_4.jpg" alt="Portfolio work 4"></figure>
    <figure class="slide"><img src="portfolio_Page_5.jpg" alt="Portfolio work 5"></figure>
    <figure class="slide"><img src="portfolio_Page_6.jpg" alt="Portfolio work 6"></figure>
    <figure class="slide"><img src="portfolio_Page_7.jpg" alt="Portfolio work 7"></figure>
  </main>

  <span class="hint" aria-hidden="true">click to browse</span>
  <span class="counter" aria-live="polite"><span id="current">01</span> / 07</span>

  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const gallery = document.querySelector('.gallery');
    const current = document.querySelector('#current');
    const hint = document.querySelector('.hint');
    let index = 0;

    function show(next) {
      slides[index].classList.remove('is-active');
      index = (next + slides.length) % slides.length;
      slides[index].classList.add('is-active');
      current.textContent = String(index + 1).padStart(2, '0');
      hint.style.opacity = '0';
    }

    gallery.addEventListener('click', (event) => {
      if (event.target.closest('a')) return;
      show(event.clientX < window.innerWidth / 2 ? index - 1 : index + 1);
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === ' ') show(index + 1);
      if (event.key === 'ArrowLeft') show(index - 1);
    });
  </script>
</body>
</html>
